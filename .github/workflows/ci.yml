name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint, Larastan y Pest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Las pruebas corren contra PostgreSQL, porque el aislamiento por negocio usa Row Level Security.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: app-secret
      DB_ADMIN_PASSWORD: owner-secret

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, intl, gd
          coverage: none
          tools: composer:v2

      - name: Obtener carpeta de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Caché de dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Crear los roles y las bases de datos
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1
          -v owner_password="$DB_ADMIN_PASSWORD" -v app_password="$DB_PASSWORD"
          -f database/roles.sql

      - name: Pint (estilo de código)
        run: composer lint

      - name: Larastan (análisis estático)
        run: composer analyse

      - name: Pest (pruebas)
        run: php artisan test

      - name: Auditar dependencias
        run: composer audit --locked --ignore-severity=low --ignore-severity=medium
