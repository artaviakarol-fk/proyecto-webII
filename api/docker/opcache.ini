; Con la carpeta del proyecto montada desde Windows, leer los archivos de PHP es muy lento.
; OPcache los guarda ya compilados en memoria y casi no vuelve a leerlos del disco.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
; Revisa cambios en los archivos como máximo cada 60 s (reiniciar la API los aplica al instante).
opcache.validate_timestamps=1
opcache.revalidate_freq=60
realpath_cache_size=4096K
realpath_cache_ttl=600
